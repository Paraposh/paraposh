<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lanekeep</title>
    <style>
      html,body{margin:0;height:100%;background:#0f1218;color:#e6e9f0;font:14px/1.3 system-ui,sans-serif;overflow:hidden}
      #stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;margin:0 auto;top:50%;transform:translateY(-50%)}
      #stage canvas{width:100%;height:100%;display:block}
      #ui{position:absolute;inset:0;pointer-events:none}
      #ui button,#ui .card,#ui .bar,#ui .herobox,#ui .menu,#ui .tip,#ui .node{pointer-events:auto}
      button{font:inherit;color:inherit;background:#2a3346;border:1px solid #46526c;border-radius:8px;padding:6px 12px;cursor:pointer}
      button:hover:not([disabled]){background:#364260}
      button[disabled]{opacity:.45;cursor:default}
      button.on{background:#4a78c8;border-color:#7aa6ee}
      button.ghost{background:transparent}
      button.big{background:#c8962e;border-color:#f0c050;color:#1a1204;font-weight:700;padding:10px 26px;font-size:16px}
      button small{display:block;opacity:.8;font-size:11px}
      .screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,18,.72)}
      .card{background:#1a2030;border:1px solid #3a4560;border-radius:14px;padding:28px 40px;display:flex;flex-direction:column;gap:12px;min-width:260px}
      .center{text-align:center;align-items:center}
      .card h1{margin:0;font-size:44px;letter-spacing:.04em;color:#f0c050}.card h2{margin:0;font-size:32px}
      .card.win h2{color:#8ee08e}.card.lose h2{color:#ff7a6a}
      .sub{margin:0;opacity:.7}.row{display:flex;gap:10px}
      .bigstars,.stars{color:#f0c050;letter-spacing:.1em}.bigstars{font-size:36px}
      #map.screen{background:#1b2a1f}
      .mapview{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 55%,#2c4a30,#18281c)}
      .maptitle{position:absolute;left:20px;top:14px;font-size:20px;font-weight:700}
      .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px 16px}
      .node.locked{filter:grayscale(1)}
      .back{position:absolute;left:20px;bottom:16px}
      .bar{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:6px 10px;background:linear-gradient(#0f1218ee,#0f121800)}
      .bar .grow{flex:1}.pill{background:#1a2030;border:1px solid #3a4560;border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
      .pill.danger{border-color:#ff6a5a;color:#ff9a8a}.pill.wide{min-width:120px;text-align:center}
      button.call{background:#2f7a4a;border-color:#5ac080}
      .dock{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
      .spell{position:relative;overflow:hidden;width:96px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center}
      .spell .cd{position:absolute;left:0;right:0;bottom:0;background:#000a;pointer-events:none}
      .spell b,.spell i{position:relative;font-size:12px;font-style:normal}.spell.armed{outline:2px solid #ffd080}
      .herobox{position:absolute;right:12px;bottom:12px;background:#1a2030;border:1px solid #3a4560;border-radius:10px;padding:8px 12px;min-width:160px;display:flex;flex-direction:column;gap:3px}
      .herobox:empty{display:none}.meter{height:6px;background:#0008;border-radius:3px;overflow:hidden}.meter span{display:block;height:100%;background:#f2d060}
      .popwrap .pop{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:3}
      .pop.up{transform:translate(-50%,-100%) translateY(-30px)}.pop.down{transform:translate(-50%,0) translateY(30px)}
      .menu{display:flex;gap:6px}.tip{background:#1a2030f0;border:1px solid #3a4560;border-radius:8px;padding:8px 12px;font-size:12px;white-space:nowrap}
      .sell{background:#5a2a2a;border-color:#a05050}
    </style>
  </head>
  <body>
    <div id="stage"><div id="ui"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
